[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "afterhours-approval-watcher"
version = "0.1.0"
description = "Conservative approval-email evaluator and explicit local mock watcher"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
afterhours-approval-watcher = "afterhours_approval_watcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/afterhours_approval_watcher"]
