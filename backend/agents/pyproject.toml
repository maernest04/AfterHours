[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "afterhours-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["afterhours-db", "droid-sdk==0.5.0", "jsonschema>=4.26,<5"]

[project.scripts]
afterhours-matching = "afterhours_agents.cli:main"
afterhours-investigate = "afterhours_investigation.worker:main"
afterhours-calculate = "afterhours_investigation.calculator:main"

[tool.uv.sources]
afterhours-db = { path = "../db", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/afterhours_agents", "src/afterhours_investigation"]
